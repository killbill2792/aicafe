name: Aggregate cost typecheck

on:
  push:
    branches:
      - chatgpt/aggregate-product-cost-fallback

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
