# Task14C foundation: no paid model call and no candidate objective attestation.
name: AI CAFE Task 14C Simulator Integrity
on:
  pull_request:
    paths: ['.github/workflows/ai-cafe-14c-owner-live.yml', 'scripts/acceptance/task14c-*']
permissions:
  contents: read
jobs:
  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/acceptance/task14c-gmail-simulator.test.mjs
      - run: node --check scripts/acceptance/task14c-live.mjs
