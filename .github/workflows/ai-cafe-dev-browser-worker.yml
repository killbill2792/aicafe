name: AI CAFE Development Browser Handoff Tests
on:
  pull_request:
    paths:
      - 'scripts/dev-dispatcher/browser-worker/**'
      - '.github/workflows/ai-cafe-dev-browser-worker.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/dev-dispatcher/browser-worker/**'
      - '.github/workflows/ai-cafe-dev-browser-worker.yml'
permissions:
  contents: read
jobs:
  isolated-contract:
    name: Native assisted-handoff contract (no provider access)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/dev-dispatcher/browser-worker/browser.test.mjs
      - name: Validate standalone handoff syntax without launching a browser
        run: |
          node --check scripts/dev-dispatcher/browser-worker/cli.mjs
          node --check scripts/dev-dispatcher/browser-worker/handoff.mjs
          node --check scripts/dev-dispatcher/browser-worker/state.mjs
      - name: Confirm retired automated login cannot start
        run: |
          if node scripts/dev-dispatcher/browser-worker/cli.mjs login chatgpt 2> /tmp/browser-worker-retired.log; then
            echo 'Unexpected automated login success' >&2
            exit 1
          fi
          grep -F 'Automated login/probe/send is retired' /tmp/browser-worker-retired.log
      - name: Verify no real browser session or token was requested
        run: |
          echo 'No browser launched; no clipboard access; no providers contacted; no credentials used.'
