name: AI CAFE Development Browser Worker Tests
on:
  pull_request:
    paths:
      - 'scripts/dev-dispatcher/browser-worker/**'
      - '.github/workflows/ai-cafe-dev-browser-worker.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/dev-dispatcher/browser-worker/**'
      - '.github/workflows/ai-cafe-dev-browser-worker.yml'
permissions:
  contents: read
jobs:
  isolated-contract:
    name: Isolated browser-worker contract (no logins)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/dev-dispatcher/browser-worker/browser.test.mjs scripts/dev-dispatcher/browser-worker/aws-desktop.test.mjs
      - name: Install isolated Selenium driver bindings (no browser)
        run: npm install --prefix scripts/dev-dispatcher/browser-worker --ignore-scripts --no-audit --no-fund
      - name: Verify Selenium and Firefox module imports
        run: |
          cd scripts/dev-dispatcher/browser-worker
          node --input-type=module -e 'const s = await import("selenium-webdriver"); const f = await import("selenium-webdriver/firefox.js"); if (!(s.default ?? s).Builder || !(f.default ?? f).Options) process.exit(1); console.log("Selenium Firefox bindings imported successfully");'
      - name: Verify no real browser session or token was requested
        run: |
          echo 'No browser launched; no real providers accessed; no credentials used.'
