# Existing AI CAFE development dispatcher. Never run untrusted PR-head code with secrets.
# PRs run deterministic tests only. On trusted main, scheduled/push reconciliation
# uses the SAME private ledger/CAS path; no other scheduler, browser or Vercel job.
name: AI CAFE Development Dispatcher
on:
  # GitHub may delay/drop scheduled events. Keep one five-minute schedule but
  # offset it from the crowded :00/:05/... boundaries.
  schedule:
    - cron: '2-59/5 * * * *'
  # When main advances, reconcile the already-received courier receipts now,
  # rather than waiting for a best-effort scheduled event. Not a new dispatcher.
  push:
    branches: [main]
  # Existing baseline checks cover new commits, and Acceptance Evidence covers
  # PR-body edits / owner-decision label changes even after code CI finished.
  # The trusted runner checks out main only; no PR-head code or artifacts run with secrets.
  workflow_run:
    workflows: ['AI CAFE Pull Request Baseline', 'AI CAFE Acceptance Evidence']
    types: [completed]
  # Owner questions can be published after the last PR commit. A trusted
  # collaborator comment on a PR wakes the same reconciler, without a cron.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      persist_private_ledger:
        type: boolean
        description: 'Write coordination state only (no messages, no merges)'
        required: false
        default: false
  pull_request:
    paths:
      - 'scripts/dev-dispatcher/**'
      - '.github/workflows/ai-cafe-dev-dispatcher.yml'
  # All credential-bearing events use code checked out from protected main.
  # Raw pull_request events are still unprivileged tests only. For privileged
  # workflow_run/issue_comment events, unit.if rejects forks and untrusted
  # commenters before the reconciliation job may access the private ledger.

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: aicafe-development-dispatcher
  cancel-in-progress: false

jobs:
  unit:
    name: Deterministic dispatcher tests
    # workflow_run is permitted only for baseline checks on same-repo PRs.
    # issue_comment is permitted only for trusted contributors on PRs.
    # Other events use their existing guards and trusted checkout context.
    if: >-
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository)) &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/dev-dispatcher/*.test.mjs scripts/dev-dispatcher/bridge/bridge.test.mjs

  reconcile:
    name: GitHub state reconciliation (no effects)
    # Never read secrets or execute PR code. All effects remain opt-in and
    # all invocations use the same trusted-main coordinator and CAS ledger.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_run' ||
      github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    needs: unit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile on trusted main (persist only when explicitly enabled)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISPATCH_LEDGER_REPO: ${{ vars.DISPATCH_LEDGER_REPO }}
          DISPATCH_LEDGER_TOKEN: ${{ secrets.DISPATCH_LEDGER_TOKEN }}
          DISPATCH_COURIER_ACTORS: ${{ vars.DISPATCH_COURIER_ACTORS }}
          DISPATCH_AUTO_MERGE: ${{ vars.DISPATCH_AUTO_MERGE }}
          DISPATCH_BRANCH_MAINTENANCE: ${{ vars.DISPATCH_BRANCH_MAINTENANCE }}
          DISPATCH_TRANSIENT_CI_RETRY: ${{ vars.DISPATCH_TRANSIENT_CI_RETRY }}
          PERSIST: ${{ (github.event_name == 'workflow_dispatch' && inputs.persist_private_ledger) || ((github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_run' || github.event_name == 'issue_comment') && vars.DISPATCH_LEDGER_AUTO_PERSIST == 'true') }}
        run: |
          if [ "$PERSIST" = "true" ]; then
            node scripts/dev-dispatcher/run.mjs --commit
          else
            node scripts/dev-dispatcher/run.mjs
          fi
      - name: Publish opaque wake-up signal (only after private ledger persistence)
        if: (github.event_name == 'workflow_dispatch' && inputs.persist_private_ledger) || ((github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_run' || github.event_name == 'issue_comment') && vars.DISPATCH_LEDGER_AUTO_PERSIST == 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISPATCH_LEDGER_REPO: ${{ vars.DISPATCH_LEDGER_REPO }}
          DISPATCH_LEDGER_TOKEN: ${{ secrets.DISPATCH_LEDGER_TOKEN }}
          DISPATCH_SIGNAL_SECRET: ${{ secrets.DISPATCH_SIGNAL_SECRET }}
        run: node scripts/dev-dispatcher/signal.mjs
