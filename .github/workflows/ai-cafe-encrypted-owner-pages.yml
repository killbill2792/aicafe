# One-time retirement notice publisher. The old public owner dashboard and
# Git-backed status snapshot are retired; no secret, ledger read, status update,
# scheduled trigger or dispatcher workflow completion may publish anything.
# This deploys ONLY the static notice when this file or docs/index.html changes.
name: Retired Owner Operations notice
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - '.github/workflows/ai-cafe-encrypted-owner-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: aicafe-retired-owner-pages
  cancel-in-progress: false
jobs:
  publish-retired-notice:
    name: Publish static retirement notice (no private data)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Stage ONLY the static retirement notice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retired-owner-pages"
          cp docs/index.html "$RUNNER_TEMP/retired-owner-pages/index.html"
          if grep -Eiq 'owner-operations-snapshot\.json|owner-dashboard\.mjs|dispatcher/state\.json' "$RUNNER_TEMP/retired-owner-pages/index.html"; then
            echo '::error::Retired page must not load old dispatcher data'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/retired-owner-pages
      - name: Deploy static retirement notice
        id: deployment
        uses: actions/deploy-pages@v4
