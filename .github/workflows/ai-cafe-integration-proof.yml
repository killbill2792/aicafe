name: AI CAFE Integration Proof
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      merged_sha:
        description: 'Exact verified squash-merge commit to validate on main'
        type: string
        required: true
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: aicafe-main-integration
  cancel-in-progress: false
jobs:
  integrated-main:
    name: Required merged-main integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.merged_sha || github.sha }}
          fetch-depth: 0
      - name: Verify target merged SHA belongs to main
        env:
          TARGET_MAIN_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.merged_sha || github.sha }}
        run: |
          [[ "$TARGET_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$TARGET_MAIN_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$TARGET_MAIN_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Full regression tests
        run: npm test
      - name: Dispatcher regression tests
        run: node --test scripts/dev-dispatcher/*.test.mjs scripts/dev-dispatcher/bridge/bridge.test.mjs
      - name: Production build
        run: npm run build -- --webpack
      - name: Capability integration scenarios
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_MAIN_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.merged_sha || github.sha }}
        run: node scripts/dev-dispatcher/integration-runner.mjs
      - name: Upload exact merged-main scenario proof
        uses: actions/upload-artifact@v4
        with:
          name: aicafe-main-integration-proof
          path: ${{ runner.temp }}/integration-proof.json
          if-no-files-found: ignore
          retention-days: 14
