name: AI CAFE Integration Proof
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/pos0f-final-*'
      - '.github/workflows/ai-cafe-integration-proof.yml'
  workflow_dispatch:
    inputs:
      merged_sha:
        description: 'Exact verified squash-merge commit to validate on main'
        type: string
        required: true
permissions:
  contents: read
  pull-requests: read
# Preserve serialized trusted-main integration proofs. Draft PR proof is isolated
# per PR and superseded heads are cancelled, never queued behind merged-main.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('aicafe-pos0f-pr-{0}', github.event.pull_request.number) || 'aicafe-main-integration' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  integrated-main:
    if: github.event_name != 'pull_request'
    name: Required merged-main integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.merged_sha || github.sha }}
          fetch-depth: 0
      - name: Verify target merged SHA belongs to main
        env:
          TARGET_MAIN_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.merged_sha || github.sha }}
        run: |
          [[ "$TARGET_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$TARGET_MAIN_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$TARGET_MAIN_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Full regression tests
        run: npm test
      - name: Dispatcher regression tests
        run: node --test scripts/dev-dispatcher/*.test.mjs scripts/dev-dispatcher/bridge/bridge.test.mjs
      - name: Production build
        run: npm run build -- --webpack
      - name: Capability integration scenarios
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_MAIN_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.merged_sha || github.sha }}
        run: node scripts/dev-dispatcher/integration-runner.mjs
      - name: Upload exact merged-main scenario proof
        uses: actions/upload-artifact@v4
        with:
          name: aicafe-main-integration-proof
          path: ${{ runner.temp }}/integration-proof.json
          if-no-files-found: ignore
          retention-days: 14

  pos0f-final-migrated-db:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/aicafe-task-POS0f'
    name: POS0f required current-source SQL isolation (disposable DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the actual submitted stacked head is included
        env:
          POS0F_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$POS0F_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$POS0F_HEAD_SHA" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Install pinned dependencies and run official field inventory
        env:
          POS0F_FIELD_MATRIX_PATH: ${{ runner.temp }}/pos0f-official-field-gaps.json
        run: |
          npm ci
          node --test scripts/pos0f-final-source-coverage.test.mjs
          node --test scripts/toast-standard-api-coverage.test.mjs
      - name: Start fully migrated disposable Supabase (no production access)
        run: |
          if [ ! -f supabase/config.toml ]; then supabase init --force; fi
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Execute negative diagnostic lineage and shared cash/stock/kitchen/menu/tenant SQL proof
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f scripts/pos0f-final-migrated-sql-integration.sql
      - name: Execute zero-cost existing registered Supervisor tool and SQL-truth preflight
        env:
          POS0E_E2_SQL_ONLY: '1'
          AICAFE_QUERY_PARITY_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          # Existing ownerParity harness calls the registered Supervisor with
          # a fake provider and independently checks SQL truth in SQL_ONLY.
          # No model API key is passed; this is NOT a real-model acceptance.
          timeout 4m npx vitest run lib/ai/agent/tools/dataQuery.ownerParity.live.test.ts
      - name: Upload exact-head field-level coverage gap matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos0f-official-field-coverage-gaps
          path: ${{ runner.temp }}/pos0f-official-field-gaps.json
          if-no-files-found: error
          retention-days: 14
      - name: Shut down disposable Supabase
        if: always()
        run: supabase stop --no-backup
