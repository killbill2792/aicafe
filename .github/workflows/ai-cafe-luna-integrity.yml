# No provider key. Every feature PR can change its own scenario data without
# editing or separately merging the trusted paid workflow.
name: AI CAFE Luna Scenario Integrity (No Provider Spend)
on:
  pull_request:
    paths:
      - '.github/luna/scenarios/**'
      - 'scripts/acceptance/shared-luna*.mjs'
      - 'scripts/acceptance/shared-luna*.sh'
      - 'scripts/acceptance/luna-evidence-validity*.mjs'
      - 'scripts/acceptance/task14b-broker*.mjs'
      - 'scripts/acceptance/luna-attest-*.mjs'
      - '.github/workflows/ai-cafe-luna-*.yml'
  push:
    branches: [main]
    paths:
      - '.github/luna/scenarios/**'
      - 'scripts/acceptance/shared-luna*.mjs'
      - 'scripts/acceptance/shared-luna*.sh'
      - 'scripts/acceptance/luna-evidence-validity*.mjs'
      - 'scripts/acceptance/task14b-broker*.mjs'
      - 'scripts/acceptance/luna-attest-*.mjs'
      - '.github/workflows/ai-cafe-luna-*.yml'
permissions:
  contents: read
jobs:
  integrity:
    name: Source/scenario security invariants (zero Luna calls)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check trusted host scripts parse
        run: |
          node --check scripts/acceptance/shared-luna.mjs
          node --check scripts/acceptance/luna-attest-13c.mjs
          node --check scripts/acceptance/luna-attest-14b.mjs
          node --check scripts/acceptance/luna-attest-13d.mjs
      - name: Validate every registered feature PR scenario and its actual test path
        run: node scripts/acceptance/shared-luna.mjs validate-all
      - name: Run fail-closed declarative scenario and one-shot replay tests
        run: node --test scripts/acceptance/shared-luna.test.mjs scripts/acceptance/luna-evidence-validity.test.mjs
      - name: Check key-isolated provider broker reservation and denial logic
        run: node --test scripts/acceptance/task14b-broker.test.mjs
  disposable-db:
    name: Real disposable Luna database preflight (zero provider spend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Execute the same trusted database bootstrap as the paid runner
        run: bash scripts/acceptance/shared-luna-db.sh
      - name: Verify actual restricted research login
        run: bash scripts/acceptance/shared-luna-u3.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for exact U3 source oracle
        run: npm ci
      - name: Execute the real U3 source oracle without a model
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import { TEST_CAFES } from './scripts/seed/cafes.mjs';
          import { readU3Oracle } from './evals/acceptance/live/u3-canonical-research.mjs';
          const db=new pg.Client({connectionString:'postgresql://postgres:postgres@127.0.0.1:54322/postgres'});
          await db.connect();
          try {
            await db.query('SET default_transaction_read_only=on');
            for (const cafe of TEST_CAFES) await readU3Oracle(db,cafe.businessId);
            console.log('Independent source oracle verified for both disposable cafes.');
          } finally { await db.end(); }
          NODE
      - name: Destroy the disposable database
        if: always()
        run: supabase stop --no-backup
