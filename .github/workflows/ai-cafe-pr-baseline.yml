name: AI CAFE Pull Request Baseline

# Run for every PR to main. Keep the original required check name in the
# final gate; all jobs must succeed, including all three regression shards.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, full ESLint and patch hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Strict TypeScript
        run: npx tsc --noEmit
      - name: Full repository ESLint
        run: npm run lint
      - name: Verify Git patch whitespace
        run: git diff --check origin/main...HEAD

  regressions:
    name: Full Vitest regressions (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # Vitest shards test FILES. Together, the three jobs execute the same
      # complete suite as npm test, without skipping any existing test.
      - name: Complete regression suite (shard ${{ matrix.shard }}/3)
        run: npm test -- --shard=${{ matrix.shard }}/3

  production-build:
    name: Next.js Webpack production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # Cache compiler artifacts across PR commits. The lockfile scopes
      # compatibility; hash only build-relevant source/config, so docs-only
      # commits reuse the same key. Restore the latest compatible build.
      - name: Restore Next.js Webpack build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('package.json', 'next.config.*', 'tsconfig.json', 'postcss.config.*', 'tailwind.config.*', 'app/**', 'components/**', 'lib/**', 'messages/**', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - name: Production build
        run: npm run build -- --webpack

  baseline:
    # Preserve this required check name for existing branch protection.
    name: AI CAFE PR baseline
    if: always()
    needs: [quality, regressions, production-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every baseline verification to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.regressions.result }}
          BUILD_RESULT: ${{ needs.production-build.result }}
        run: |
          echo "Quality: $QUALITY_RESULT"
          echo "Full test suite (all shards): $TEST_RESULT"
          echo "Production build: $BUILD_RESULT"
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
