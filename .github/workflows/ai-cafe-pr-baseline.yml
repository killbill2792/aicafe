name: AI CAFE Pull Request Baseline

# Every PR gets the fail-closed required check. Only code changes run the
# expensive checks; a push to main still warms the production build cache.
# Preserve the required check name, including its full-suite enforcement.
on:
  push:
    branches:
      - main
  # Validate authorized stacked draft PRs against their real upstream base,
  # not only PRs that already target main. No Vercel preview deployments.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  changes:
    name: Detect changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      e2e: ${{ steps.filter.outputs.e2e }}
      browser_required: ${{ steps.browser_select.outputs.browser_required }}
      browser_scenarios: ${{ steps.browser_select.outputs.browser_scenarios }}
      supervisor: ${{ steps.filter.outputs.supervisor }}
      docs_only: ${{ steps.filter.outputs['docs-only'] == 'true' && steps.filter.outputs['non-docs'] == 'false' && steps.filter.outputs.e2e == 'false' && steps.filter.outputs.supervisor == 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classify changed paths with local Git (no API rate-limit dependency)
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/acceptance/owner-gate.mjs classify
      - name: Select real browser journeys from the PR diff (fail closed)
        id: browser_select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/e2e/targeted.mjs select

  quality:
    needs: changes
    if: ${{ always() && github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.code == 'true')) }}
    name: TypeScript, full ESLint and patch hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Strict TypeScript
        run: npx tsc --noEmit
      - name: Full repository ESLint
        run: npm run lint
      - name: Verify Git patch whitespace against the actual PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  regressions:
    needs: changes
    if: ${{ always() && github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.code == 'true')) }}
    name: Full Vitest regressions (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # Vitest shards test FILES. Together, the three jobs execute the same
      # complete suite as npm test, without skipping any existing test.
      - name: Complete regression suite (shard ${{ matrix.shard }}/3)
        run: npm test -- --shard=${{ matrix.shard }}/3

  production-build:
    needs: changes
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.code == 'true')) }}
    name: Next.js Webpack production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # Cache compiler artifacts across PR commits. The lockfile scopes
      # compatibility; hash only build-relevant source/config, so docs-only
      # commits reuse the same key. Restore the latest compatible build.
      - name: Restore Next.js Webpack build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('package.json', 'next.config.*', 'tsconfig.json', 'postcss.config.*', 'tailwind.config.*', 'app/**', 'components/**', 'lib/**', 'messages/**', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - name: Production build
        run: npm run build -- --webpack


  supervisor-evals:
    # No paid provider, secrets, or retired GitHub Models permission.
    permissions:
      contents: read
    needs: changes
    if: ${{ always() && github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.supervisor == 'true')) }}
    name: Supervisor promptfoo eval
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check P1 evaluator installation
        id: eval_ready
        shell: bash
        run: |
          has_config=false
          has_script=false
          if [ -f evals/supervisor/promptfooconfig.yaml ]; then has_config=true; fi
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['eval:supervisor'] ? 0 : 1)"; then has_script=true; fi
          if [ "$has_config" != "$has_script" ]; then
            echo "Incomplete P1 Supervisor eval installation" >&2
            exit 1
          fi
          if [ "$has_config" = false ]; then
            echo "P1 has not landed; no promptfoo harness yet."
          fi
          echo "ready=$has_config" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.eval_ready.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        if: steps.eval_ready.outputs.ready == 'true'
        run: npm ci
      - name: Run zero-cost recorded Supervisor evals
        if: steps.eval_ready.outputs.ready == 'true'
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'
          PROMPTFOO_DISABLE_UPDATE_CHECK: '1'
          NODE_OPTIONS: --conditions=react-server
        run: npm run eval:supervisor

  guards:
    if: github.event_name != 'push'
    name: Repo guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run every repository guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/guards/run-all.mjs

  db:
    # Every SQL and database test, on throwaway local databases only. The steps
    # and their order live in scripts/db/run-all.sh.
    needs: changes
    if: ${{ always() && github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.code == 'true')) }}
    name: Database tests (local Supabase and PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # Both are slow and independent, so they run side by side.
      - name: Install locked dependencies and start local Supabase once (database only, never production)
        run: |
          npm ci --ignore-scripts >"$RUNNER_TEMP/npm-ci.log" 2>&1 &
          npm_ci=$!
          if [ ! -f supabase/config.toml ]; then supabase init --force; fi
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          npm_ci_status=0
          wait "$npm_ci" || npm_ci_status=$?
          cat "$RUNNER_TEMP/npm-ci.log"
          exit "$npm_ci_status"
      - name: Run every SQL and database test
        run: bash scripts/db/run-all.sh
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  browser:
    # Only material UI/browser changes pay the local Supabase + Chromium cost.
    # The unchanged required baseline aggregate rejects a missing/skipped job.
    needs: changes
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.browser_required == 'true')) }}
    name: Targeted seeded Playwright (local Next.js + Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # This deliberately cannot authorize model calls. The seeded browser
      # test rejects both real credentials and a missing sentinel.
      OPENAI_API_KEY: 'aicafe-disposable-e2e-no-provider'
      VERCEL_URL: ''
      BROWSER_SCENARIOS: ${{ github.event_name == 'workflow_dispatch' && 'home,staff,menu,money,gmail' || needs.changes.outputs.browser_scenarios }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Install locked browser + app dependencies
        run: npm ci
      - name: Generate two-cafe synthetic seed and start disposable Supabase Auth/API
        run: |
          set -euo pipefail
          node scripts/seed/generateSeedSql.mjs
          supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          supabase db reset --local --yes
          supabase status -o json > "$RUNNER_TEMP/e2e-supabase-status.json"
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from "node:fs";
          const data = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/e2e-supabase-status.json","utf8"));
          const anon = data.ANON_KEY ?? data.anon_key;
          const service = data.SERVICE_ROLE_KEY ?? data.service_role_key;
          if (!anon || !service) throw Error("Disposable Supabase auth credentials missing");
          for (const key of [anon,service]) console.log("::add-mask::" + key);
          appendFileSync(process.env.GITHUB_ENV,
            "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321\n" +
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=" + anon + "\n" +
            "SUPABASE_SERVICE_ROLE_KEY=" + service + "\n");
          NODE
      - name: Start locally bound Next.js and verify login route readiness
        run: |
          set -euo pipefail
          npm run dev -- --webpack --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/e2e-next.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/e2e-next.pid"
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsSL 'http://127.0.0.1:3000/en/login' -o /dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
      - name: Verify selector and required-proof negative cases
        run: node --test scripts/e2e/targeted.test.mjs
      - name: Run selected real authenticated Playwright cases
        run: node scripts/e2e/targeted.mjs run
      - name: Verify exact-head executed case counts; never accept skipped/missing proof
        if: always()
        run: node scripts/e2e/targeted.mjs verify
      - name: Upload required redacted execution receipt (no cookies/traces/screenshots)
        id: browser_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aicafe-e2-targeted-browser-proof
          path: test-results/e2e/proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Link executed browser job and artifact
        if: steps.browser_artifact.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.browser_artifact.outputs.artifact-url }}
        run: |
          echo "### Targeted seeded Playwright acceptance" >> "$GITHUB_STEP_SUMMARY"
          echo "Run/job: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — Targeted seeded Playwright" >> "$GITHUB_STEP_SUMMARY"
          echo "Proof artifact: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Local Next.js diagnostics on failure
        if: failure()
        run: tail -80 "$RUNNER_TEMP/e2e-next.log" 2>/dev/null || true
      - name: Tear down local test processes and database
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/e2e-next.pid" ]; then kill "$(cat "$RUNNER_TEMP/e2e-next.pid")" || true; fi
          supabase stop --no-backup || true

  evaluator-integrity:
    # Always-on zero-cost checks for the *test itself*. No provider key,
    # customer data, or browser/DB service. Recorded calibration != live proof.
    needs: changes
    if: ${{ always() && github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.code == 'true')) }}
    name: Acceptance evaluator integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kill-test the evaluator with known bad observations
        run: node --test evals/acceptance/evidence.test.mjs
      - name: Verify independent synthetic calibration is not live proof
        run: node evals/acceptance/cli.mjs

  owner-journey-acceptance:
    # A required no-secret executable domain gate for every code PR.
    # No arbitrary PR code receives OpenAI or OAuth credentials.
    needs: changes
    if: ${{ always() && github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.code == 'true')) }}
    name: Owner journey acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENAI_API_KEY: ''
      VERCEL_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Mutation-test owner-domain selection and proof validation
        run: node --test scripts/acceptance/owner-gate.test.mjs
      - name: Execute all selected registered domain regressions
        run: node scripts/acceptance/owner-gate.mjs run
      - name: Verify exact-head proof and actual case execution
        run: node scripts/acceptance/owner-gate.mjs verify
      - name: Upload redacted exact-head domain proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aicafe-required-owner-journey-proof
          path: test-results/acceptance/owner-journey-proof.json
          if-no-files-found: warn
          retention-days: 14

  baseline:
    # Preserve the branch-protection check, even for docs-only pull requests.
    name: AI CAFE PR baseline
    if: ${{ always() && github.event_name != 'push' }}
    needs: [changes, quality, regressions, production-build, supervisor-evals, evaluator-integrity, owner-journey-acceptance, guards, db, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require success or an explicitly expected skip
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          E2E_CHANGED: ${{ needs.changes.outputs.e2e }}
          SUPERVISOR_CHANGED: ${{ needs.changes.outputs.supervisor }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.regressions.result }}
          BUILD_RESULT: ${{ needs.production-build.result }}
          EVAL_RESULT: ${{ needs.supervisor-evals.result }}
          EVALUATOR_RESULT: ${{ needs.evaluator-integrity.result }}
          OWNER_JOURNEY_RESULT: ${{ needs.owner-journey-acceptance.result }}
          GUARDS_RESULT: ${{ needs.guards.result }}
          DB_RESULT: ${{ needs.db.result }}
          BROWSER_REQUIRED: ${{ needs.changes.outputs.browser_required }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        shell: bash
        run: |
          echo "Changes: $CHANGES_RESULT; code=$CODE_CHANGED; e2e=$E2E_CHANGED; supervisor=$SUPERVISOR_CHANGED; docs-only=$DOCS_ONLY"
          echo "Quality: $QUALITY_RESULT; Vitest: $TEST_RESULT; build: $BUILD_RESULT; database: $DB_RESULT; Supervisor: $EVAL_RESULT; guards: $GUARDS_RESULT; browser-required: $BROWSER_REQUIRED; browser: $BROWSER_RESULT"
          echo "Evaluator integrity: $EVALUATOR_RESULT (synthetic only; not live-model acceptance)"
          echo "Owner journey acceptance: $OWNER_JOURNEY_RESULT (registered domain regressions, not paid Luna proof)"
          test "$GUARDS_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$CHANGES_RESULT" = success
            # An empty classification on a nonempty PR is never an approval.
            if [ "$CODE_CHANGED" != true ] && [ "$DOCS_ONLY" != true ] && [ "$SUPERVISOR_CHANGED" != true ] && [ "$E2E_CHANGED" != true ]; then
              echo "Unclassified PR change" >&2
              exit 1
            fi
          else
            test "$CHANGES_RESULT" = skipped
          fi
          if [ "$DOCS_ONLY" = true ]; then
            test "$CODE_CHANGED" = false
            test "$SUPERVISOR_CHANGED" = false
            test "$E2E_CHANGED" = false
          fi
          if [ "$CODE_CHANGED" = true ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$EVALUATOR_RESULT" = success
             test "$OWNER_JOURNEY_RESULT" = success
            test "$QUALITY_RESULT" = success
            test "$TEST_RESULT" = success
            test "$BUILD_RESULT" = success
            test "$DB_RESULT" = success
          else
            test "$EVALUATOR_RESULT" = skipped
             test "$OWNER_JOURNEY_RESULT" = skipped
            test "$QUALITY_RESULT" = skipped
            test "$TEST_RESULT" = skipped
            test "$BUILD_RESULT" = skipped
            test "$DB_RESULT" = skipped
          fi
          if [ "$EVENT_NAME" = workflow_dispatch ] || { [ "$EVENT_NAME" = pull_request ] && [ "$BROWSER_REQUIRED" = true ]; }; then
            # Manual full-baseline runs must not launder a skipped browser
            # check into a passing PR-head required status.
            test "$BROWSER_RESULT" = success
          else
            test "$BROWSER_RESULT" = skipped
          fi
          if [ "$SUPERVISOR_CHANGED" = true ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$EVAL_RESULT" = success
          else
            test "$EVAL_RESULT" = skipped
          fi
