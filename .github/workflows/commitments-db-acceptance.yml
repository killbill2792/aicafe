name: General commitments — disposable Supabase acceptance
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/commitments-db-acceptance.sql'
      - '.github/workflows/commitments-db-acceptance.yml'
      - 'lib/operating/commitments.server.ts'
      - 'lib/ai/agent/tools/commitments.ts'
      - 'lib/ai/conversations/agentRunner.server.ts'
      - 'app/api/cron/refresh-derived/route.ts'
  workflow_dispatch:
concurrency:
  group: commitments-db-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  commitments-postgres:
    name: "Owner reminders: real PostgreSQL lifecycle and RLS"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Initialize disposable Supabase config
        run: |
          if [ ! -f supabase/config.toml ]; then supabase init --force; fi
      - name: Start isolated Supabase
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Replay all migrations against throwaway PostgreSQL
        run: supabase db reset --local --yes
      - name: "Real SQL: owner scope, dedupe, crash recovery, due once, close and DST"
        run: |
          PGPASSWORD=postgres psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/commitments-db-acceptance.sql
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
