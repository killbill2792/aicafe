# Failure-only observation of the existing dispatcher; NOT another dispatcher.
# Runs trusted main code without checking out failed PR heads.
name: Dispatcher failure observer
on:
  workflow_run:
    workflows:
      - AI CAFE Development Dispatcher
      - Dispatcher delayed self-wake
    types: [completed]
permissions:
  contents: read
jobs:
  report:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'startup_failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main, never the failed run's code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Queue failed-run incident through existing private Git-backed Muse queue
        env:
          DISPATCH_LEDGER_TOKEN: ${{ secrets.DISPATCH_LEDGER_TOKEN }}
          DISPATCH_FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/dev-dispatcher/emergency-report.mjs
