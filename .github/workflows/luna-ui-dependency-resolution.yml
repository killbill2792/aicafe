name: Luna UI dependency resolution (draft only)
on:
  pull_request:
    branches: [claude/finish-answers]
    paths: [package.json, .github/workflows/luna-ui-dependency-resolution.yml]
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'claude/luna-upstream-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve package lock without executing dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit lock delta for review
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const old=JSON.parse(execFileSync('git',['show','HEAD:package-lock.json'],{encoding:'utf8'}));
          const next=JSON.parse(readFileSync('package-lock.json','utf8'));
          for(const [name,value] of Object.entries(next.packages))if(JSON.stringify(old.packages[name])!==JSON.stringify(value))console.log('LOCK_DELTA '+JSON.stringify([name,value]));
          for(const name of Object.keys(old.packages))if(!Object.hasOwn(next.packages,name))console.log('LOCK_DELTA '+JSON.stringify([name,null]));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: luna-ui-resolved-lock
          path: package-lock.json
