name: Olivia PR 1B Availability UI Verification
on:
  pull_request:
    paths:
      - "components/staff/**"
      - "app/**/more/manage-staff/**"
      - "lib/scheduling/**"
      - "lib/actions/schedulingFoundation.ts"
      - "lib/calc/scheduling/**"
      - "messages/**"
      - "supabase/migrations/20261014000061_olivia_availability_batch.sql"
      - "supabase/migrations/20261014000062_olivia_coverage_concurrency.sql"
      - "supabase/migrations/20261014000063_olivia_qualification_concurrency.sql"
      - "scripts/olivia-pr1b-*"
      - ".github/workflows/olivia-pr1b-verify.yml"
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: All Vitest tests
        run: npm run test
      - name: TypeScript strict
        run: npx tsc --noEmit
      - name: Repository-wide lint baseline
        continue-on-error: true
        run: npm run lint
      - name: Scoped scheduling UI/backend lint
        run: npx eslint "components/staff/*.tsx" "lib/scheduling/*.ts" "lib/actions/schedulingFoundation.ts" "lib/calc/scheduling/*.ts" "app/[locale]/more/manage-staff/page.tsx"
      - name: Build
        run: npm run build
      - name: Whitespace
        run: git diff --check origin/main...HEAD
  disposable-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Start disposable local Supabase
        run: |
          if [ ! -f supabase/config.toml ]; then supabase init --force; fi
          supabase start
      - name: Check SQL anonymous block delimiters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bad = {'DO ' + chr(36), 'END ' + chr(36) + ';'}
          paths = (
              'scripts/olivia-pr1b-rls.sql',
              'supabase/migrations/20261014000061_olivia_availability_batch.sql',
              'supabase/migrations/20261014000062_olivia_coverage_concurrency.sql',
              'supabase/migrations/20261014000063_olivia_qualification_concurrency.sql',
          )
          for path in paths:
              lines = Path(path).read_text().splitlines()
              assert all(line.strip() not in bad for line in lines), f'Bad SQL block in {path}'
          PY
      - name: Replay ALL migrations in disposable Supabase
        run: supabase db reset --local --yes
      - name: Preserve PR1A tenant/compensation/RLS regressions
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/olivia-pr1a-rls.sql
      - name: PR1B atomic availability/RLS regressions
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/olivia-pr1b-rls.sql
      - name: Concurrent independent PR1A create regression
        run: bash scripts/olivia-pr1a-create-concurrency.sh
      - name: Concurrent independent PR1B batch co-owners
        run: bash scripts/olivia-pr1b-create-concurrency.sh
      - name: Concurrent equivalent coverage creates with different keys
        run: python3 scripts/olivia-pr1b-coverage-concurrency.py
      - name: Concurrent qualification creates and assignments
        run: python3 scripts/olivia-pr1b-qualification-concurrency.py
      - name: Olivia PR3 real concurrent owner approval and publication
        run: python3 scripts/olivia-pr3-concurrency.py
      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup
