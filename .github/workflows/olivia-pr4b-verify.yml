name: Olivia PR4B-A Scheduling Command Verification
on:
  pull_request:
    paths:
      - "lib/scheduling/oliviaCommand*"
      - "lib/scheduling/oliviaAvailabilityProposal.ts"
      - "lib/scheduling/oliviaOwnerAction.server.ts"
      - "lib/scheduling/oliviaCommands.server*"
      - "supabase/migrations/20261017000069_olivia_multi_availability_command.sql"
      - "scripts/olivia-pr4b-rls.sql"
      - "scripts/olivia-pr4b-concurrency.sh"
      - ".github/workflows/olivia-pr4b-verify.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  types-tests-build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npx eslint "lib/scheduling/oliviaCommand*.ts" "lib/scheduling/oliviaAvailabilityProposal.ts" "lib/scheduling/oliviaOwnerAction.server.ts"
      - name: Repository-wide lint (existing unrelated baseline errors)
        continue-on-error: true
        run: npm run lint
      - run: npm run build
      - run: git diff --check origin/main...HEAD
  disposable-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Start disposable local Supabase
        run: |
          if [ ! -f supabase/config.toml ]; then supabase init --force; fi
          supabase start
      - name: Apply all migrations to disposable database
        run: supabase db reset --local --yes
      - name: Olivia PR4B-A tenant, CAS, replay and atomicity regressions
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/olivia-pr4b-rls.sql
      - name: Real two-session same-café and cross-café lock regression
        run: bash scripts/olivia-pr4b-concurrency.sh
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
