name: Owner facts migration 110 - real PostgreSQL
on:
  pull_request:
    paths:
      - "lib/ownerFacts/**"
      - "supabase/migrations/20261028000110_owner_facts.sql"
      - ".github/workflows/owner-facts-db.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-facts-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ownerfacts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ownerfacts_test"
          --health-interval 3s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        if: github.event_name != 'pull_request'
        run: npx tsc --noEmit
      - name: ESLint - entire repository (includes every changed file)
        if: github.event_name != 'pull_request'
        run: npm run lint
      # On PRs the baseline runs every other test; this job runs the owner-facts
      # tests against PostgreSQL (manual runs keep the full suite).
      - name: Owner-facts Vitest including migration 110 against PostgreSQL
        env:
          OWNER_FACTS_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/ownerfacts_test
        run: npx vitest run ${{ github.event_name == 'pull_request' && 'lib/ownerFacts' || '' }}
