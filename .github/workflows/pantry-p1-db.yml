name: Pantry P1 Database Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261022000079_pantry_packs.sql"
      - "scripts/test-pantry-db.mjs"
      - ".github/workflows/pantry-p1-db.yml"
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run pantry migration and scoped mutation tests
        run: node scripts/test-pantry-db.mjs
