name: PDF dependency resolution (temporary)
on:
  pull_request:
    branches: [claude/luna-upstream-ui]
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  lock:
    if: github.head_ref == 'claude/luna-pdf-renderer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          cp package-lock.json /tmp/old-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact @json-render/react-pdf@0.23.1
          node --input-type=module -e 'import fs from "node:fs";const old=JSON.parse(fs.readFileSync("/tmp/old-lock.json","utf8"));const next=JSON.parse(fs.readFileSync("package-lock.json","utf8"));for(const [k,v] of Object.entries(next.packages))if(JSON.stringify(v)!==JSON.stringify(old.packages[k]))console.log("PDF_LOCK_ENTRY "+JSON.stringify([k,v]));for(const k of Object.keys(old.packages))if(!(k in next.packages))console.log("PDF_LOCK_DELETE "+JSON.stringify(k));'
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-package-lock
          path: package-lock.json
