name: Phase 7 Proactive Team Verification
on:
  push:
    branches: [chatgpt/supervisor-phase7-team-alerts-whatsapp]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cafe_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cafe_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint 'app/[locale]/operations/page.tsx' app/api/ai/notifications/route.ts app/api/cron/team-alerts/route.ts components/operations/OwnerWhatsAppAlerts.tsx 'lib/ai/notifications/**/*.ts'
      - name: Tests
        run: npm test
      - name: Disposable PostgreSQL migration 36 security checks
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cafe_rls_test
        run: node scripts/test-ai-notifications-migration.mjs
      - name: Build
        run: npm run build
      - name: Diff
        run: git diff --check origin/main...HEAD
