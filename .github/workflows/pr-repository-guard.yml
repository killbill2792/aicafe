name: PR repository marker
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
jobs:
  repository-marker:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check PR body without running PR code
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const matches = [...body.matchAll(/^\s*<!--\s*repo:\s*([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\s+task:\s*([^\s>]+)\s*-->\s*$/gm)];
            if (!matches.length) {
              core.warning('No repository marker; warning only.');
            } else if (matches.some(m => m[1] !== matches[0][1])) {
              core.warning('Conflicting repository markers in PR body. Fix: keep exactly one standalone <!-- repo: ' + context.repo.owner + '/' + context.repo.repo + ' task: <actual-task-id> --> line.');
            } else if (matches[0][1].toLowerCase() !== context.repo.owner.toLowerCase() + '/' + context.repo.repo.toLowerCase()) {
              core.warning('This PR says it belongs to ' + matches[0][1] + ' but is in ' + context.repo.owner + '/' + context.repo.repo + '. Fix: replace the marker with <!-- repo: ' + context.repo.owner + '/' + context.repo.repo + ' task: <actual-task-id> -->, using the real task ID.');
            } else {
              core.info('PR repository marker matches.');
            }
