name: Register choice navigation verification
on:
  pull_request:
    paths:
      - 'components/onboarding/RegisterChoice.tsx'
      - 'components/onboarding/RegisterChoice.test.ts'
      - '.github/workflows/register-choice-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Toast, Square and upload routing regression tests
        run: npx vitest run components/onboarding/RegisterChoice.test.ts
      - name: Full regression suite
        run: npm run test
      - name: Lint changed files
        run: npx eslint components/onboarding/RegisterChoice.tsx components/onboarding/RegisterChoice.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build (placeholder public env only)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
