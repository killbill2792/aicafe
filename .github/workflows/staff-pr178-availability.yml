name: Staff PR178 all-day availability and owner isolation
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261027000096_staff_full_day_availability.sql'
      - 'scripts/staff-pr178-availability-rls.sql'
      - 'scripts/staff-person-input-guard-rls.sql'
      - 'scripts/staff-pr155-rls.sql'
      - '.github/workflows/staff-pr178-availability.yml'
permissions: {contents: read}
jobs:
  disposable-db:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: {version: latest}
      - name: Start disposable Supabase
        run: |
          if [ ! -f supabase/config.toml ]; then supabase init --force; fi
          supabase start
      - name: Apply migrations without production access
        run: supabase db reset --local --yes
      - name: Prior direct RPC validation and RLS
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/staff-person-input-guard-rls.sql
      - name: Prior compensation and person-edit regressions
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/staff-pr155-rls.sql
      - name: Exact full-day owner RPC round trip and tenant separation
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/staff-pr178-availability-rls.sql
      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup
