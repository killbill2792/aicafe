name: Supervisor Experience Verification
on:
  push:
    branches: [chatgpt/supervisor-experience-responses-20261010]
    paths:
      - 'app/api/ai/threads/**'
      - 'app/api/ai/transcribe/**'
      - 'app/api/ai/usage/**'
      - 'app/\[locale\]/page.tsx'
      - 'components/shared/AddCostFab.tsx'
      - 'components/home/SupervisorFabOverlap.test.ts'
      - 'components/home/**'
      - 'lib/ai/agent/**'
      - 'lib/ai/conversations/**'
      - 'lib/ai/cafeTools.server.ts'
      - 'lib/ai/tools.ts'
      - 'supabase/migrations/*ai_usage*'
      - '.github/workflows/supervisor-experience-verify.yml'
  pull_request:
    paths:
      - 'app/api/ai/threads/**'
      - 'app/api/ai/transcribe/**'
      - 'app/api/ai/usage/**'
      - 'app/\[locale\]/page.tsx'
      - 'components/shared/AddCostFab.tsx'
      - 'components/home/SupervisorFabOverlap.test.ts'
      - 'components/home/**'
      - 'lib/ai/agent/**'
      - 'lib/ai/conversations/**'
      - 'lib/ai/cafeTools.server.ts'
      - 'lib/ai/tools.ts'
      - 'supabase/migrations/*ai_usage*'
      - '.github/workflows/supervisor-experience-verify.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install
        run: npm ci
      # The universal baseline runs all tests, typecheck, ESLint and Webpack
      # build on every PR; this job adds targeted Supervisor coverage.
      - name: Supervisor experience regressions
        run: npx vitest run lib/ai/agent lib/ai/conversations components/home
      - name: Supervisor experience scoped ESLint
        run: npx eslint lib/ai/agent lib/ai/conversations components/home
      # The historical push trigger is standalone (no PR baseline).
      - name: Standalone full verification (historical push only)
        if: github.event_name == 'push'
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
          npm run build -- --webpack
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
