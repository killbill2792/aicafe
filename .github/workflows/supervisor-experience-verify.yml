name: Supervisor Experience Verification
on:
  push:
    branches: [chatgpt/supervisor-experience-responses-20261010]
    paths:
      - 'app/api/ai/threads/**'
      - 'app/api/ai/transcribe/**'
      - 'app/api/ai/usage/**'
      - 'app/\[locale\]/page.tsx'
      - 'components/shared/AddCostFab.tsx'
      - 'components/home/SupervisorFabOverlap.test.ts'
      - 'components/home/**'
      - 'lib/ai/agent/**'
      - 'lib/ai/conversations/**'
      - 'lib/ai/operatingBrain.ts'
      - 'lib/ai/cafeTools.server.ts'
      - 'lib/ai/tools.ts'
      - 'supabase/migrations/*ai_usage*'
      - '.github/workflows/supervisor-experience-verify.yml'
  pull_request:
    paths:
      - 'app/api/ai/threads/**'
      - 'app/api/ai/transcribe/**'
      - 'app/api/ai/usage/**'
      - 'app/\[locale\]/page.tsx'
      - 'components/shared/AddCostFab.tsx'
      - 'components/home/SupervisorFabOverlap.test.ts'
      - 'components/home/**'
      - 'lib/ai/agent/**'
      - 'lib/ai/conversations/**'
      - 'lib/ai/operatingBrain.ts'
      - 'lib/ai/cafeTools.server.ts'
      - 'lib/ai/tools.ts'
      - 'supabase/migrations/*ai_usage*'
      - '.github/workflows/supervisor-experience-verify.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint changed JavaScript and TypeScript
        shell: bash
        run: |
          mapfile -d '' -t changed < <(git diff --name-only --diff-filter=ACMR -z origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs')
          if (( ${#changed[@]} > 0 )); then
            npx eslint "${changed[@]}"
          else
            echo "No changed JS/TS sources."
          fi
      - name: Full repository ESLint (baseline audit)
        continue-on-error: true
        run: npm run lint
      - name: Unit and regression tests
        run: npm test
      - name: Next.js production build
        run: npm run build
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
