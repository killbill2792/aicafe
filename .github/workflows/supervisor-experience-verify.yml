name: Supervisor Experience Verification
on:
  push:
    branches: [chatgpt/supervisor-experience-responses-20261010]
  pull_request:
    paths:
      - 'app/api/ai/**'
      - 'app/[locale]/page.tsx' 'components/shared/AddCostFab.tsx' 'components/home/SupervisorFabOverlap.test.ts'
      - 'components/home/**'
      - 'lib/ai/**'
      - 'messages/**'
      - 'supabase/migrations/*ai_usage*'
      - '.github/workflows/supervisor-experience-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Changed-file ESLint
        run: |
          npx eslint 'lib/ai/conversations/runSupervisorTurn.server.ts' 'lib/ai/conversations/toolRegistry.server.ts' \
            'lib/ai/conversations/usage.server.ts' 'lib/ai/conversations/contracts.ts' \
            'lib/ai/conversations/dateRange.ts' 'lib/ai/conversations/context.ts' \
            'lib/ai/conversations/domainProjections.ts' 'lib/ai/conversations/domainProjections.test.ts' \
            'lib/ai/conversations/periodComparison.ts' 'lib/ai/conversations/periodComparison.test.ts' \
            'lib/ai/conversations/semanticEval.ts' 'lib/ai/conversations/semantic-eval.test.ts' \
            'lib/ai/conversations/runSupervisorTurn.server.test.ts' 'lib/ai/conversations/diagnostics.server.ts' 'lib/ai/conversations/diagnostics.server.test.ts' 'lib/ai/supervisorReads.server.ts' 'lib/ai/conversations/usage.increment.test.ts' \
            'lib/ai/conversations/replyValidation.ts' 'components/home/SupervisorChatComposer.tsx' \
            'components/home/SupervisorHomePanel.tsx' 'app/[locale]/page.tsx' \
            'app/api/ai/usage/route.ts' 'app/api/ai/threads/[threadId]/messages/route.ts' 'app/api/ai/threads/[threadId]/messages/route.test.ts'
      # Keep repository-wide lint findings visible without blocking scoped changes:
      # baseline main has existing errors in AggregateProductCostEditor and seed/demoData.mjs.
      - name: Full repository ESLint (baseline audit)
        continue-on-error: true
        run: npm run lint
      - name: Unit and regression tests
        run: npm test
      - name: Next.js production build
        run: npm run build
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
