name: Supervisor Home Phase One Verification

on:
  push:
    branches:
      - chatgpt/supervisor-home-ui

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint changed files
        run: npx eslint 'app/[locale]/page.tsx' components/TabBar.tsx components/home/HomeTaskSections.tsx components/home/SupervisorHomePanel.tsx components/shared/navTabs.ts lib/viewmodels/homeSnapshotQuality.ts lib/viewmodels/homeSnapshotQuality.test.ts
      - name: All tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Diff whitespace
        run: git diff --check origin/main...HEAD
