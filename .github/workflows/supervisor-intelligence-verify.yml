name: Supervisor Intelligence and Voice Verification
on:
  push:
    branches:
      - chatgpt/supervisor-finance-sales-voice-20261010
  pull_request:
    paths:
      - 'lib/ai/**'
      - 'lib/ai/conversations/**'
      - 'app/api/ai/**'
      - 'components/home/SupervisorChatComposer.tsx'
      - 'messages/**'
      - '.github/workflows/supervisor-intelligence-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint changed JavaScript and TypeScript
        shell: bash
        run: |
          mapfile -d '' -t changed < <(git diff --name-only --diff-filter=ACMR -z origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs')
          if (( ${#changed[@]} > 0 )); then
            npx eslint "${changed[@]}"
          else
            echo "No changed JS/TS sources."
          fi
      - name: All unit and regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Whitespace
        run: git diff --check origin/main...HEAD
