name: Supervisor Intelligence and Voice Verification
on:
  push:
    branches:
      - chatgpt/supervisor-finance-sales-voice-20261010
    paths:
      - 'lib/ai/conversations/voiceClient*'
      - 'lib/ai/conversations/dictationState*'
      - 'lib/ai/conversations/attachments*'
      - 'lib/ai/conversations/context*'
      - 'lib/ai/conversations/dateRange*'
      - 'lib/ai/conversations/periodComparison*'
      - 'lib/ai/supervisorFacts.server*'
      - 'lib/ai/supervisorReads.server*'
      - 'app/api/ai/transcribe/**'
      - 'app/api/ai/threads/**'
      - 'components/home/SupervisorChatComposer.tsx'
      - '.github/workflows/supervisor-intelligence-verify.yml'
  pull_request:
    paths:
      - 'lib/ai/conversations/voiceClient*'
      - 'lib/ai/conversations/dictationState*'
      - 'lib/ai/conversations/attachments*'
      - 'lib/ai/conversations/context*'
      - 'lib/ai/conversations/dateRange*'
      - 'lib/ai/conversations/periodComparison*'
      - 'lib/ai/supervisorFacts.server*'
      - 'lib/ai/supervisorReads.server*'
      - 'app/api/ai/transcribe/**'
      - 'app/api/ai/threads/**'
      - 'components/home/SupervisorChatComposer.tsx'
      - '.github/workflows/supervisor-intelligence-verify.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint changed JavaScript and TypeScript
        shell: bash
        run: |
          mapfile -d '' -t changed < <(git diff --name-only --diff-filter=ACMR -z origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs')
          if (( ${#changed[@]} > 0 )); then
            npx eslint "${changed[@]}"
          else
            echo "No changed JS/TS sources."
          fi
      - name: All unit and regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Whitespace
        run: git diff --check origin/main...HEAD
