name: Supervisor Intelligence and Voice Verification
on:
  push:
    branches:
      - chatgpt/supervisor-finance-sales-voice-20261010
    paths:
      - 'lib/ai/conversations/voiceClient*'
      - 'lib/ai/conversations/dictationState*'
      - 'lib/ai/conversations/attachments*'
      - 'lib/ai/conversations/context*'
      - 'lib/ai/conversations/dateRange*'
      - 'lib/ai/conversations/periodComparison*'
      - 'lib/ai/supervisorFacts.server*'
      - 'lib/ai/supervisorReads.server*'
      - 'app/api/ai/transcribe/**'
      - 'app/api/ai/threads/**'
      - 'components/home/SupervisorChatComposer.tsx'
      - '.github/workflows/supervisor-intelligence-verify.yml'
  pull_request:
    paths:
      - 'lib/ai/conversations/voiceClient*'
      - 'lib/ai/conversations/dictationState*'
      - 'lib/ai/conversations/attachments*'
      - 'lib/ai/conversations/context*'
      - 'lib/ai/conversations/dateRange*'
      - 'lib/ai/conversations/periodComparison*'
      - 'lib/ai/supervisorFacts.server*'
      - 'lib/ai/supervisorReads.server*'
      - 'app/api/ai/transcribe/**'
      - 'app/api/ai/threads/**'
      - 'components/home/SupervisorChatComposer.tsx'
      - '.github/workflows/supervisor-intelligence-verify.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # All PRs additionally run the complete global baseline.
      - name: Voice and conversation regressions
        run: npx vitest run lib/ai/conversations
      - name: Voice and conversation scoped ESLint
        run: npx eslint lib/ai/conversations
      # Standalone historical pushes have no universal PR baseline.
      - name: Standalone full verification (historical push only)
        if: github.event_name == 'push'
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
          npm run build -- --webpack
      - name: Whitespace
        run: git diff --check origin/main...HEAD
