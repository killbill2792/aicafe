name: Universal Supervisor Platform P1 Verification

on:
  pull_request:
    paths:
      - "lib/metrics/**"
      - "lib/ai/tools.ts"
      - "lib/ai/cafeTools.server.ts"
      - "lib/data/**"
      - "lib/operating/**"
      - ".github/workflows/supervisor-p1-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p1:
    # The universal PR baseline owns full typecheck, lint, tests and build.
    # Keep the Supervisor-specific checks here; don't rerun the full app.
    name: P1 catalog, typecheck, regressions, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: P1 bidirectional coverage and negative security tests
        run: npx vitest run lib/metrics
      - name: Focused metrics ESLint
        run: npx eslint lib/metrics
      # Standalone manual dispatch does not trigger the universal PR baseline.
      # Retain the comprehensive verification in that mode.
      - name: Standalone full verification (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
          npm run build -- --webpack
      - name: Whitespace
        run: git diff --check origin/main...HEAD
