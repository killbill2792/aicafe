name: Supervisor Phase 2 Verification
on:
  push:
    branches:
      - chatgpt/supervisor-phase2-engine-boundary

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Changed file lint
        run: npx eslint lib/operating/cafeState.ts lib/operating/cafeState.test.ts lib/operating/types.ts lib/ai/tools.ts lib/ai/tools.test.ts lib/ai/cafeTools.server.ts
      - name: All tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Whitespace
        run: git diff --check origin/main...HEAD
