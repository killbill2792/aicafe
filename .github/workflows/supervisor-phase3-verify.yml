name: Supervisor Phase 3 Verification
on:
  push:
    branches:
      - chatgpt/supervisor-phase3-conversations

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cafe_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cafe_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Changed-file ESLint
        run: npx eslint 'app/api/ai/**/*.ts' 'lib/ai/conversations/**/*.ts'
      - name: Regression tests
        run: npm run test
      - name: Disposable PostgreSQL RLS checks
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cafe_rls_test
        run: node scripts/test-supervisor-conversation-rls.mjs
      - name: Production build
        run: npm run build
      - name: Diff integrity
        run: git diff --check origin/main...HEAD
