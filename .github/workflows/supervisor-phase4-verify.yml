name: Supervisor Phase 4 Verification
on:
  push:
    branches:
      - chatgpt/supervisor-phase4-grounded-chat
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Changed lint
        run: npx eslint 'app/[locale]/page.tsx' 'app/api/ai/threads/[threadId]/messages/route.ts' components/home/SupervisorHomePanel.tsx components/home/SupervisorChatComposer.tsx 'lib/ai/conversations/**/*.ts'
      - name: Full test suite
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Whitespace
        run: git diff --check origin/main...HEAD
