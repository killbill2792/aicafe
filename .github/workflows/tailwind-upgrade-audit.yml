name: Tailwind official upgrade audit (temporary)
on:
  pull_request:
    branches: [claude/finish-answers]
    paths: [.github/workflows/tailwind-upgrade-audit.yml]
permissions:
  contents: read
jobs:
  upgrade:
    if: github.head_ref == 'claude/luna-upstream-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cb41ebf7a3cc19e27a66b09be54e79489662b3f3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run official v3-to-v4 upgrade against clean parent
        run: npx --yes @tailwindcss/upgrade@4.1.18 --force
      - name: Emit migration patches for review
        if: always()
        run: |
          git status --short
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:30*1024*1024});
          const paths=git('diff','--name-only','-z').split('\0').filter(Boolean);
          for(const path of paths) {
            if(path==='package-lock.json')continue;
            console.log('UPGRADE_PATCH '+JSON.stringify([path,git('diff','--no-ext-diff','--unified=1','--',path)]));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailwind-upgrade-review
          path: |
            app/globals.css
            tailwind.config.*
            postcss.config.*
            package.json
