name: Toast disposable database integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/**toast**'
      - 'supabase/migrations/20261027000101_pos_menu_copy.sql'
      - 'supabase/migrations/20261012000051_toast_stabilization.sql'
      - 'scripts/toast-db-integration.sql'
      - 'scripts/toast-pr2-sql-integration.sql'
      - 'scripts/toast-pr3-sql-integration.sql'
      - 'scripts/toast-pr-h-sql-integration.sql'
      - 'scripts/toast-pos-copy-sql-integration.sql'
      - 'scripts/toast-raw-sample-sql-integration.sql'
      - 'scripts/toast-archive-incremental-sql-integration.sql'
      - 'scripts/sync-cafe-data.mjs'
      - 'scripts/sync-cafe-data-db-integration.mjs'
      - '.github/workflows/toast-db-integration.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Initialize ephemeral local Supabase config
        run: |
          if [ ! -f supabase/config.toml ]; then supabase init --force; fi
      - name: Start disposable local Supabase (never production)
        run: supabase start
      - name: Replay every migration including 40-51 in exact order
        run: supabase db reset --local --yes
      - name: Rebuild the fresh disposable database a second time
        run: supabase db reset --local --yes
      - name: Reapply additive migration 103 without dropping data
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f supabase/migrations/20261028000103_toast_copy_backfill.sql
      - name: Run real PostgreSQL isolation, rollback and lease integration tests
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/toast-db-integration.sql
      - name: Exercise Toast PR1 atomic import and RLS
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/toast-pr1-sql-integration.sql
      - name: Exercise Toast PR2 atomic coverage and post-commit retry regressions
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/toast-pr2-sql-integration.sql
      - name: Exercise Toast PR3 owner flags and failed-run recovery
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/toast-pr3-sql-integration.sql
      - name: Exercise Toast H owner summary RLS, modes, shared budgets and visible closeout recovery
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/toast-pr-h-sql-integration.sql
      - name: Verify migration 101 catalog and nullable wage invariants
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/toast-pos-copy-sql-integration.sql
      - name: Verify raw sample UUID RPC, isolation and cooldown against real PostgreSQL
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/toast-raw-sample-sql-integration.sql
      - name: Verify re-imports store only new or changed Toast records
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/toast-archive-incremental-sql-integration.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies for the test café copy check
        run: npm ci --ignore-scripts
      - name: Verify the test café copy against real PostgreSQL
        run: node scripts/sync-cafe-data-db-integration.mjs
        env:
          SYNC_TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
