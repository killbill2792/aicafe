name: Toast disposable database integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/**toast**'
      - 'supabase/migrations/20261012000051_toast_stabilization.sql'
      - 'scripts/toast-db-integration.sql'
      - 'scripts/toast-pr2-sql-integration.sql'
      - '.github/workflows/toast-db-integration.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Initialize ephemeral local Supabase config
        run: |
          if [ ! -f supabase/config.toml ]; then supabase init --force; fi
      - name: Start disposable local Supabase (never production)
        run: supabase start
      - name: Replay every migration including 40-51 in exact order
        run: supabase db reset --local --yes
      - name: Run real PostgreSQL isolation, rollback and lease integration tests
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/toast-db-integration.sql
      - name: Exercise Toast PR1 atomic import and RLS
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/toast-pr1-sql-integration.sql
      - name: Exercise Toast PR2 atomic coverage and post-commit retry regressions
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/toast-pr2-sql-integration.sql
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
