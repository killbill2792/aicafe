name: Toast DIAGNOSTIC capture (manual only)

# DIAGNOSTIC_ONLY: explicit owner-invoked API coverage investigation.
# Does NOT populate operational current records and MUST NOT feed Supervisor,
# production canonical views or screen metrics. No scheduled data accumulation.
# Existing shared Toast 10-minute operational cron is separate.
on:
  workflow_dispatch:
    inputs:
      cafe_name:
        description: Exact connected café name (required only for standard_customer_probe)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: toast-raw-capture-daily
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' && github.ref_name != 'diag/toast-standard-customer-field-probe-20261121'
    environment: toast-prod
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # tsx is not a locked project dependency; install a pinned runner explicitly.
      - run: npm install --no-save --package-lock=false --ignore-scripts tsx@4.20.6
      - run: test -x node_modules/.bin/tsx
      - name: Capture (counts only; raw output suppressed)
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOAST_CUSTOMER_HASH_KEY: ${{ secrets.TOAST_CUSTOMER_HASH_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          TOAST_ALLOWED_API_HOSTS: ${{ secrets.TOAST_ALLOWED_API_HOSTS }}
        run: |
          set +x
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          set +e
          NODE_OPTIONS=--conditions=react-server ./node_modules/.bin/tsx scripts/toast-diagnostic-capture-manual.ts >"$output" 2>&1
          code=$?
          node - "$output" "$code" <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync(process.argv[2], 'utf8');
          const exitCode = Number(process.argv[3]);
          // Never print raw stdout/stderr: exceptions may contain credentials or payloads.
          let s;
          try { s = JSON.parse(text.trim().split('\n').pop()); } catch {}
          const keys = ['planned','completed','partial','skipped','failed','deferred'];
          if (s && typeof s === 'object' && keys.every(k => Number.isSafeInteger(s[k]))) {
            for (const k of keys) console.log('Toast capture ' + k + ': ' + s[k]);
            const reasons = Array.isArray(s.reasons) ? s.reasons.filter(r => /^[a-z_]{1,40}$/.test(r)) : [];
            if (reasons.length) console.log('Reasons: ' + reasons.join(', '));
          } else {
            console.log('Toast capture: failed (details suppressed)');
          }
          if (exitCode !== 0 || !s || s.failed) process.exit(1);
          NODE

  # DIAGNOSTIC_ONLY: owner-invoked bounded Standard API field *presence* report.
  # Does not change imports, archive, customer identities, or schedules.
  standard_customer_probe:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'diag/toast-standard-customer-field-probe-20261121'
    environment: toast-prod
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts tsx@4.20.6
      - name: Verify field-presence counter (synthetic data only)
        run: node --test scripts/toast-standard-customer-probe-core.test.mjs
      - name: One-time Standard API probe (no raw response output)
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          TOAST_ALLOWED_API_HOSTS: ${{ secrets.TOAST_ALLOWED_API_HOSTS }}
          TOAST_PROBE_CAFE_NAME: ${{ inputs.cafe_name }}
        run: |
          set +x
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          set +e
          NODE_OPTIONS=--conditions=react-server ./node_modules/.bin/tsx scripts/toast-standard-customer-probe.ts >"$output" 2>&1
          code=$?
          node - "$output" "$code" <<'NODE'
          const fs = require('node:fs');
          // Never echo original stdout/stderr: exceptions may contain private values.
          const lines = fs.readFileSync(process.argv[2], 'utf8').trim().split('\n');
          let r;
          try { r = JSON.parse(lines.at(-1)); } catch {}
          const endpointNames = ['bulk','order_detail','payment_detail'];
          if (!r || !['completed','failed'].includes(r.status)) {
            console.log('Toast Standard customer probe: failed (details suppressed)');
            process.exit(1);
          }
          if (r.status === 'failed') {
            const reasons = new Set(['probe_not_configured','cafe_not_unique_or_available',
              'verified_restaurant_not_unique','invalid_location','no_eligible_source_orders',
              'fewer_than_ten_eligible_orders','probe_unavailable']);
            console.log('Toast Standard customer probe failed: ' +
              (reasons.has(r.reason) ? r.reason : 'probe_unavailable'));
            process.exit(1);
          }
          console.log('Toast Standard customer probe completed; zero raw payloads stored');
          console.log('Orders sampled: ' + Number(r.sampleSize || 0));
          console.log('Sample categories: ' + JSON.stringify(r.sampleCategoryCounts || {}));
          for (const name of endpointNames) {
            const x = r.endpoints?.[name];
            const s = x?.requestCounts ?? {};
            console.log(name + ' requests: ' + JSON.stringify({
              attempted: Number(s.attempted || 0), success: Number(s.success || 0),
              failed: Number(s.failed || 0), failureCategories: s.failureCategories || {}
            }));
            // Only predetermined field names and safe provider schema key names,
            // with absent / explicit null / empty / populated counts. No values.
            console.log(name + ' field coverage: ' + JSON.stringify(x?.fieldCoverage || {}));
          }
          if (Number(process.argv[3]) !== 0) process.exit(1);
          NODE
