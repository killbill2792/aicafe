name: Toast raw sample

on:
  workflow_dispatch:
    inputs:
      business_id:
        description: Café business UUID
        required: true
        default: 0200c26e-b971-4236-ac6b-56dd191ec59b
        type: string
      business_date:
        description: Business date (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: toast-raw-sample-${{ inputs.business_id }}
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capture sample (redacted logs)
        shell: bash
        env:
          BUSINESS_ID: ${{ inputs.business_id }}
          BUSINESS_DATE: ${{ inputs.business_date }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          TOAST_ALLOWED_API_HOSTS: ${{ secrets.TOAST_ALLOWED_API_HOSTS }}
        run: |
          set +x
          node -e 'if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(process.env.BUSINESS_ID||"")||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(process.env.BUSINESS_DATE||""))process.exit(1)' || { echo 'Invalid workflow inputs'; exit 1; }
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx scripts/toast-raw-sample.ts --business "$BUSINESS_ID" --date "$BUSINESS_DATE" >"$output" 2>&1
          code=$?
          node - "$output" "$code" <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync(process.argv[2], 'utf8');
          const exitCode = Number(process.argv[3]);
          // Never print raw stdout/stderr: exceptions may contain credentials or payloads.
          let result;
          try { result = JSON.parse(text.trim()); } catch {}
          if (result && typeof result === 'object' && Number.isSafeInteger(result.captured) &&
              Number.isSafeInteger(result.failed) && typeof result.skipped === 'boolean') {
            const reasons = new Set(['invalid_request','no_location','busy','cooldown','db_error']);
            const status = result.skipped ? 'skipped' : result.failed ? 'partial_failure' : 'completed';
            console.log('Toast sample status: ' + status);
            console.log('Captured endpoint samples: ' + result.captured);
            console.log('Failed endpoint samples: ' + result.failed);
            if (reasons.has(result.reason)) console.log('Status reason: ' + result.reason);
          } else {
            console.log('Toast sample status: failed (details suppressed)');
          }
          if (exitCode !== 0 || !result || result.skipped || result.failed) process.exit(1);
          NODE
