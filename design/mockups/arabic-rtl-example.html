<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اليوم</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F6F1E9}
a{color:#2F5D8A}a:hover{color:#1F4468}
</style>
</head>
<body>
<div dir="rtl" style="width: 390px; height: 1010px; box-sizing: border-box; background: #F6F1E9; font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; color: #2A1D14; display: flex; flex-direction: column; gap: 14px; padding: 24px 16px 32px">

<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; color: #6B5B4E; font-weight: 500">السبت، 26 سبتمبر</div>
<div style="font-size: 22px; font-weight: 700">مقهاك</div>
</div>
<button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #E0D4C3; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; color: #2A1D14">عربي · EN</button>
</div>

<div style="background: #FFFFFF; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 18px; font-weight: 600; color: #6B5B4E">المال المتبقي اليوم</div>
<div style="font-size: 13px; font-weight: 600; color: #6B5B4E; background: #F1EAE0; padding: 5px 10px; border-radius: 12px">تقديري</div>
</div>
<div dir="ltr" style="font-family: Fraunces, Georgia, serif; font-size: 72px; font-weight: 700; line-height: 1.05; color: #1E6B4B; text-align: right">$580</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: #1E6B4B">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
<span>أكثر بـ $140 من يوم سبت عادي</span>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 32px; height: 32px; border-radius: 16px; background: #E3F0E8; color: #1E6B4B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></div>
<div style="font-size: 17px; font-weight: 700">غُطّيت كل التكاليف الساعة 10:40 صباحًا</div>
</div>
<div style="position: relative; height: 14px; border-radius: 7px; background: #1E6B4B">
<div style="position: absolute; right: 35%; top: -5px; width: 3px; height: 24px; background: #2A1D14; border-radius: 2px"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #6B5B4E; font-weight: 500">
<span>المطلوب $853</span>
<span>المبيعات $2,400</span>
</div>
</div>

<div style="background: #FBE9DC; border-radius: 18px; padding: 12px 16px 12px 12px; display: flex; align-items: center; gap: 12px">
<div style="color: #B4460E; display: flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6"></path><path d="M12 16.5v.5"></path></svg></div>
<div style="flex-grow: 1; font-size: 15px; font-weight: 600; color: #6E2A07">فاتورة الماء لم تُضَف هذا الشهر</div>
<button style="height: 44px; padding: 0 18px; border-radius: 22px; border: none; background: #B4460E; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700">أضِف</button>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 18px; font-weight: 700">أين ذهب كل دولار</div>
<div style="display: flex; height: 40px; border-radius: 12px; overflow: hidden; gap: 3px">
<div style="width: 27%; background: #8B5A2B"></div>
<div style="width: 33%; background: #2F5D8A"></div>
<div style="width: 3%; background: #A7B0BA"></div>
<div style="width: 13%; background: #E0AE4E"></div>
<div style="width: 24%; background: #1E6B4B"></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 36px; height: 36px; border-radius: 10px; background: #8B5A2B; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"></path><path d="M16 10h2a2 2 0 0 1 0 4h-2"></path></svg></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 700">27¢</span><span style="font-size: 13px; color: #6B5B4E">المكوّنات</span></div>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 36px; height: 36px; border-radius: 10px; background: #2F5D8A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 700">33¢</span><span style="font-size: 13px; color: #6B5B4E">الموظفون</span></div>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 36px; height: 36px; border-radius: 10px; background: #E0AE4E; color: #2A1D14; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 700">13¢</span><span style="font-size: 13px; color: #6B5B4E">الإيجار والفواتير</span></div>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 36px; height: 36px; border-radius: 10px; background: #A7B0BA; color: #2A1D14; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M3 10h18"></path></svg></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 700">3¢</span><span style="font-size: 13px; color: #6B5B4E">رسوم البطاقات</span></div>
</div>
<div style="display: flex; align-items: center; gap: 10px; grid-column: span 2; background: #E3F0E8; border-radius: 12px; padding: 8px 10px">
<div style="width: 36px; height: 36px; border-radius: 10px; background: #1E6B4B; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M17 7H10a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6H6"></path></svg></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 700; color: #1E6B4B">24¢</span><span style="font-size: 13px; color: #2A4A3A">لك أنت</span></div>
</div>
</div>
</div>

</div>
</body>
</html>
