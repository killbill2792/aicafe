<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F6F1E9}
a{color:#2F5D8A}a:hover{color:#1F4468}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F1E9; font-family: Figtree, 'Helvetica Neue', sans-serif; color: #2A1D14; display: flex; flex-direction: column; gap: 22px; padding: 48px 24px 32px">

<div style="width: 64px; height: 64px; border-radius: 20px; background: #2A1D14; color: #F6F1E9; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"></path><path d="M16 10h2a2 2 0 0 1 0 4h-2"></path><path d="M8 3v2"></path><path d="M12 3v2"></path></svg></div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-family: Fraunces, Georgia, serif; font-size: 36px; font-weight: 700; line-height: 1.1">Find where your café loses money.</div>
<div style="font-size: 18px; color: #6B5B4E; line-height: 1.4">No typing. No receipts. Just connect.</div>
</div>

<div style="background: #FFFFFF; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 36px; height: 36px; border-radius: 18px; background: #2A1D14; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0">1</div>
<span style="font-size: 17px; font-weight: 600">Tap connect</span>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 36px; height: 36px; border-radius: 18px; background: #2A1D14; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0">2</div>
<span style="font-size: 17px; font-weight: 600">Log in to your POS</span>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 36px; height: 36px; border-radius: 18px; background: #1E6B4B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></div>
<span style="font-size: 17px; font-weight: 600">Your first report in minutes</span>
</div>
</div>

<div style="display: flex; align-items: flex-start; gap: 10px; font-size: 15px; color: #4A3A2E; line-height: 1.4; padding: 0 4px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E6B4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
<span>We only read your sales and timecards. We never change anything or touch your money.</span>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<button style="height: 60px; border: none; border-radius: 30px; background: #2A1D14; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 700">Connect Square</button>
<button style="height: 56px; border: 1px solid #E0D4C3; border-radius: 28px; background: #FFFFFF; color: #2A1D14; font-family: inherit; font-size: 17px; font-weight: 600">I use Toast</button>
</div>

</div>
</body>
</html>
